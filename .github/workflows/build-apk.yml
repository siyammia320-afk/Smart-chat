name: Build SMART CHAT APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Prepare Firebase Config and Keystore
        run: |
          python3 - << 'PYEOF'
          import os, json, base64

          os.makedirs("app/src/main/res/values", exist_ok=True)

          key_part_1 = "AIza"
          key_part_2 = "SyBRFYac1zvq5QQUrH9UejKuaIB_oGvMqi8"
          api_key = key_part_1 + key_part_2

          web_client = "770436601775-m707qk69u50bvafouq2nmjo6qeerbeeg.apps.googleusercontent.com"
          android_client = "770436601775-uvbvag2imqjdchnb0v1t1olg757gve1o.apps.googleusercontent.com"
          cert_hash = "a75564603b82ba23c7e48e257821683788a1f79b"
          app_id = "1:770436601775:android:f79039db2e3da9682d815a"

          def make_client(pkg):
              return {
                  "client_info": {
                      "mobilesdk_app_id": app_id,
                      "android_client_info": {"package_name": pkg}
                  },
                  "oauth_client": [
                      {
                          "client_id": android_client,
                          "client_type": 1,
                          "android_info": {
                              "package_name": pkg,
                              "certificate_hash": cert_hash
                          }
                      },
                      {
                          "client_id": web_client,
                          "client_type": 3
                      }
                  ],
                  "api_key": [{"current_key": api_key}],
                  "services": {
                      "appinvite_service": {
                          "other_platform_oauth_client": [
                              {
                                  "client_id": web_client,
                                  "client_type": 3
                              }
                          ]
                      }
                  }
              }

          google_services = {
              "project_info": {
                  "project_number": "770436601775",
                  "project_id": "gen-lang-client-0636266750",
                  "storage_bucket": "gen-lang-client-0636266750.firebasestorage.app"
              },
              "client": [
                  make_client("smart.chat"),
                  make_client("com.example")
              ],
              "configuration_version": "1"
          }

          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(google_services, f, indent=2)

          xml_path = "app/src/main/res/values/firebase_applet_config.xml"
          if not os.path.exists(xml_path):
              xml_content = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firebase_project_id" translatable="false">gen-lang-client-0636266750</string>
              <string name="firebase_database_id" translatable="false">ai-studio-android-840e1286-d8b0-4357-8b06-707f1248dfd6</string>
          </resources>
          """
              with open(xml_path, "w", encoding="utf-8") as f:
                  f.write(xml_content.strip() + "\n")

          b64_keystore = "app/debug.keystore.base64"
          keystore_path = "app/debug.keystore"
          if os.path.exists(b64_keystore) and not os.path.exists(keystore_path):
              with open(b64_keystore, "rb") as f:
                  raw = f.read()
              with open(keystore_path, "wb") as f:
                  f.write(base64.b64decode(raw))
          PYEOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload SMART CHAT Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-CHAT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
