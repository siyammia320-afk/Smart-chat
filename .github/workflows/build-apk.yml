name: Build SMART CHAT APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Ensure Firebase Config Files Exist
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "" | base64 -d > app/google-services.json
          fi
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/firebase_applet_config.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firebase_project_id" translatable="false">gen-lang-client-0636266750</string>
              <string name="firebase_database_id" translatable="false">ai-studio-android-840e1286-d8b0-4357-8b06-707f1248dfd6</string>
          </resources>
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode Debug Keystore
        run: |
          if [ -f "app/debug.keystore.base64" ] && [ ! -f "app/debug.keystore" ]; then
            base64 -d app/debug.keystore.base64 > app/debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload SMART CHAT Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-CHAT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
